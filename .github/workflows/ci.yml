name: CI and production deployment

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hrms-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hrms-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/hrms-frontend

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hrms
          POSTGRES_PASSWORD: hrms
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hrms -d hrms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hrms:hrms@localhost:5432/hrms_test
      JWT_SECRET: ci-test-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    strategy:
      matrix:
        include:
          - component: backend
            image_env: BACKEND_IMAGE
          - component: frontend
            image_env: FRONTEND_IMAGE
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Sign in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=${!IMAGE_ENV}" >> "$GITHUB_OUTPUT"
        env:
          IMAGE_ENV: ${{ matrix.image_env }}
      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          target: prod
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  deploy-production:
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: [images]
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.PRODUCTION_SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/hrms_deploy
          chmod 600 ~/.ssh/hrms_deploy
          printf '%s\n' "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Upload deployment bundle
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          SERVER_PORT: ${{ vars.PRODUCTION_SERVER_PORT || '22' }}
        run: |
          remote_stage="/tmp/hrms-${GITHUB_SHA}"
          ssh -i ~/.ssh/hrms_deploy -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "mkdir -p '$remote_stage'"
          scp -i ~/.ssh/hrms_deploy -P "$SERVER_PORT" \
            docker-compose.prod.yml nginx/nginx.prod.conf deploy/deploy.sh \
            "$SERVER_USER@$SERVER_HOST:$remote_stage/"
      - name: Deploy and verify
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          SERVER_PORT: ${{ vars.PRODUCTION_SERVER_PORT || '22' }}
          BIND_PORT: ${{ vars.HRMS_BIND_PORT || '8081' }}
        run: |
          remote_stage="/tmp/hrms-${GITHUB_SHA}"
          ssh -i ~/.ssh/hrms_deploy -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" \
            "chmod +x '$remote_stage/deploy.sh' && DEPLOY_DIR=/opt/hrms RELEASE_SHA='$GITHUB_SHA' IMAGE_TAG='sha-$GITHUB_SHA' GHCR_NAMESPACE='${GITHUB_REPOSITORY_OWNER,,}' HRMS_BIND_PORT='$BIND_PORT' '$remote_stage/deploy.sh'"
      - name: Remove temporary deployment bundle
        if: always()
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.PRODUCTION_SERVER_HOST }}
          SERVER_USER: ${{ secrets.PRODUCTION_SERVER_USER }}
          SERVER_PORT: ${{ vars.PRODUCTION_SERVER_PORT || '22' }}
        run: ssh -i ~/.ssh/hrms_deploy -p "$SERVER_PORT" "$SERVER_USER@$SERVER_HOST" "rm -rf '/tmp/hrms-${GITHUB_SHA}'" || true
